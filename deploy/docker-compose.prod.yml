name: deva

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
      POSTGRES_USER: ${POSTGRES_USER:-deva_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - deva-private

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-capstone}
      DB_USER: ${POSTGRES_USER:-deva_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BLOCKCHAIN_ENABLED: ${BLOCKCHAIN_ENABLED:-true}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-http://host.docker.internal:8545}
      BLOCKCHAIN_CHAIN_ID: ${BLOCKCHAIN_CHAIN_ID:-20260720}
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:?BLOCKCHAIN_CONTRACT_ADDRESS is required}
      BLOCKCHAIN_ARTIFACT_PATH: ${BLOCKCHAIN_ARTIFACT_PATH:-blockchain/artifacts/EvidenceRegistryV3.json}
      BLOCKCHAIN_WRITER_PRIVATE_KEY: ${BLOCKCHAIN_WRITER_PRIVATE_KEY:?BLOCKCHAIN_WRITER_PRIVATE_KEY is required}
      BLOCKCHAIN_DEPLOYMENT_BLOCK: ${BLOCKCHAIN_DEPLOYMENT_BLOCK:-12}
      BLOCKCHAIN_CONFIRMATIONS: ${BLOCKCHAIN_CONFIRMATIONS:-0}
      BLOCKCHAIN_REQUEST_TIMEOUT_SECONDS: ${BLOCKCHAIN_REQUEST_TIMEOUT_SECONDS:-30}
      BLOCKCHAIN_CONFIRMATION_TIMEOUT_SECONDS: ${BLOCKCHAIN_CONFIRMATION_TIMEOUT_SECONDS:-120}
      BLOCKCHAIN_CONFIRMATION_POLL_INTERVAL_SECONDS: ${BLOCKCHAIN_CONFIRMATION_POLL_INTERVAL_SECONDS:-1}
      QBFT_BLOCK_PERIOD_SECONDS: ${QBFT_BLOCK_PERIOD_SECONDS:-5}
      BLOCKCHAIN_MAX_BLOCK_AGE_SECONDS: ${BLOCKCHAIN_MAX_BLOCK_AGE_SECONDS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-uploads:/app/backend/uploads
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - deva-private

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - deva-private

networks:
  deva-private:
    driver: bridge

volumes:
  postgres-data:
  backend-uploads:
